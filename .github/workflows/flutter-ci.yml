name: FinTrack CI

on:
  push:
    branches: [master]
    paths-ignore:
      - '*.md'
      - 'docs/**'
  pull_request:
    branches: [master]
  # Manual trigger for on-demand APK builds
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze-and-test:
    name: Analyze + Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate code (freezed, riverpod_generator, json_serializable)
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Analyze
        run: flutter analyze

      - name: Run unit tests
        run: flutter test --coverage

  build-apk:
    name: Build Release APK
    runs-on: ubuntu-latest
    needs: analyze-and-test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Build release APK
        run: |
          flutter build apk --release \
            --dart-define=GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY || '' }} \
            --dart-define=ALPHA_VANTAGE_KEY=${{ secrets.ALPHA_VANTAGE_KEY || '' }}

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: fintrack-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

  build-web:
    name: Build Web
    runs-on: ubuntu-latest
    needs: analyze-and-test
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Build web
        run: flutter build web --release

      - name: Upload web build
        uses: actions/upload-artifact@v4
        with:
          name: fintrack-web
          path: build/web/
          retention-days: 14

  web-uat:
    name: Web UAT (Integration Tests)
    runs-on: ubuntu-latest
    needs: analyze-and-test
    # Skip on PRs — this is a flaky web driver test for a mobile-first app.
    # Runs only on push to master and manual dispatch. Post-merge signal only.
    if: github.event_name != 'pull_request'
    continue-on-error: true  # Non-blocking — integration tests may need env-specific setup
    timeout-minutes: 15      # Fail fast instead of hanging ~21 min on a stuck driver
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: stable
          cache: true

      - uses: nanasess/setup-chromedriver@v2

      - name: Install dependencies
        run: flutter pub get

      - name: Generate code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Start ChromeDriver
        run: chromedriver --port=4444 &

      - name: Run web integration tests (TC-01..TC-08)
        run: |
          flutter drive \
            --driver=test_driver/integration_test.dart \
            --target=integration_test/app_test.dart \
            -d web-server --browser-name=chrome --headless \
            --web-renderer=html \
            --web-browser-flag=--no-sandbox \
            --web-browser-flag=--disable-dev-shm-usage \
            --web-browser-flag=--disable-gpu \
            --dart-define=GEMINI_API_KEY=
