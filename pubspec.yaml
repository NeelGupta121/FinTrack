name: fintrack
description: AI-powered investment & expense tracker. India-first, global-ready.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State & Architecture
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5
  freezed_annotation: ^2.4.1
  go_router: ^14.2.0

  # Backend
  supabase_flutter: ^2.5.0

  # Network & Cache
  dio: ^5.4.3
  flutter_cache_manager: ^3.3.1

  # Storage
  hive_flutter: ^1.1.0
  flutter_secure_storage: ^9.2.2

  # AI/ML
  tflite_flutter: ^0.10.4
  google_generative_ai: ^0.4.3
  google_mlkit_text_recognition: ^0.11.0

  # Charts & UI
  fl_chart: ^0.68.0
  shimmer: ^3.0.0
  flutter_slidable: ^3.1.0
  intl: ^0.19.0

  # Permissions & Platform
  permission_handler: ^11.3.1
  telephony: ^0.2.0
  local_auth: ^2.2.0
  share_plus: ^9.0.0

  # Security
  freerasp: ^6.5.0

  # Utils
  uuid: ^4.4.0
  equatable: ^2.0.5
  json_annotation: ^4.9.0
  path_provider: ^2.1.3

dev_dependencies:
  build_runner: ^2.4.9
  freezed: ^2.5.2
  json_serializable: ^6.8.0
  riverpod_generator: ^2.4.0
  mocktail: ^1.0.3
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/ml/
    - assets/fonts/
