# FinTrack Supabase Configuration
# Docs: https://supabase.com/docs/guides/cli/config

[project]
id = "your-project-ref"
name = "fintrack"

[api]
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 15

[studio]
port = 54323

[auth]
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/auth/callback"]
jwt_expiry = 3600

[auth.external.google]
enabled = false
client_id = ""
secret = ""
